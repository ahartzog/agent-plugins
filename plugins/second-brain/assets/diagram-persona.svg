<svg viewBox="0 0 800 520" width="800" height="520" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <rect width="800" height="520" fill="#111113" rx="8"/>

  <!-- Center persona node -->
  <rect x="290" y="200" width="220" height="80" rx="8" fill="#334eff" opacity="0.9"/>
  <text x="400" y="232" text-anchor="middle" fill="#edeef0" font-size="15" font-weight="700">Your Domain Persona</text>
  <text x="400" y="254" text-anchor="middle" fill="#d1e1ff" font-size="11" font-weight="400">Persistent identity + knowledge</text>

  <!-- Knowledge file nodes -->
  <rect x="80" y="80" width="160" height="56" rx="6" fill="#212225" stroke="#363a3f" stroke-width="1"/>
  <text x="160" y="104" text-anchor="middle" fill="#edeef0" font-size="12" font-weight="600">overview.md</text>
  <text x="160" y="120" text-anchor="middle" fill="#868a92" font-size="10">Architecture, topology</text>

  <rect x="560" y="80" width="160" height="56" rx="6" fill="#212225" stroke="#363a3f" stroke-width="1"/>
  <text x="640" y="104" text-anchor="middle" fill="#edeef0" font-size="12" font-weight="600">stakeholders.md</text>
  <text x="640" y="120" text-anchor="middle" fill="#868a92" font-size="10">People, roles, contacts</text>

  <rect x="60" y="340" width="172" height="56" rx="6" fill="#212225" stroke="#363a3f" stroke-width="1"/>
  <text x="146" y="364" text-anchor="middle" fill="#edeef0" font-size="12" font-weight="600">deployment-runbook.md</text>
  <text x="146" y="380" text-anchor="middle" fill="#868a92" font-size="10">Procedures, gotchas</text>

  <rect x="568" y="340" width="160" height="56" rx="6" fill="#212225" stroke="#363a3f" stroke-width="1"/>
  <text x="648" y="364" text-anchor="middle" fill="#edeef0" font-size="12" font-weight="600">schedule.md</text>
  <text x="648" y="380" text-anchor="middle" fill="#868a92" font-size="10">Milestones, deadlines</text>

  <!-- Lines from center to knowledge files -->
  <line x1="340" y1="220" x2="240" y2="136" stroke="#7d8fff" stroke-width="1.5" opacity="0.5"/>
  <line x1="460" y1="220" x2="560" y2="136" stroke="#7d8fff" stroke-width="1.5" opacity="0.5"/>
  <line x1="340" y1="260" x2="232" y2="340" stroke="#7d8fff" stroke-width="1.5" opacity="0.5"/>
  <line x1="460" y1="260" x2="568" y2="340" stroke="#7d8fff" stroke-width="1.5" opacity="0.5"/>

  <!-- External source nodes -->
  <rect x="20" y="190" width="110" height="40" rx="20" fill="none" stroke="#3fd869" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="75" y="215" text-anchor="middle" fill="#3fd869" font-size="11" font-weight="500">Jira MCP</text>

  <rect x="20" y="252" width="110" height="40" rx="20" fill="none" stroke="#3fd869" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="75" y="277" text-anchor="middle" fill="#3fd869" font-size="11" font-weight="500">Slack CLI</text>

  <rect x="670" y="190" width="110" height="40" rx="20" fill="none" stroke="#3fd869" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="725" y="215" text-anchor="middle" fill="#3fd869" font-size="11" font-weight="500">GitHub</text>

  <rect x="670" y="252" width="110" height="40" rx="20" fill="none" stroke="#3fd869" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="725" y="277" text-anchor="middle" fill="#3fd869" font-size="11" font-weight="500">CircleCI</text>

  <!-- Lines from center to external sources -->
  <line x1="290" y1="230" x2="130" y2="210" stroke="#3fd869" stroke-width="1" opacity="0.4"/>
  <line x1="290" y1="250" x2="130" y2="272" stroke="#3fd869" stroke-width="1" opacity="0.4"/>
  <line x1="510" y1="230" x2="670" y2="210" stroke="#3fd869" stroke-width="1" opacity="0.4"/>
  <line x1="510" y1="250" x2="670" y2="272" stroke="#3fd869" stroke-width="1" opacity="0.4"/>

  <!-- Delegation arrow to another persona -->
  <rect x="310" y="440" width="180" height="52" rx="6" fill="#2e3135" stroke="#7d8fff" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="400" y="462" text-anchor="middle" fill="#7d8fff" font-size="12" font-weight="600">Security Review</text>
  <text x="400" y="478" text-anchor="middle" fill="#868a92" font-size="10">delegated persona</text>

  <line x1="400" y1="280" x2="400" y2="440" stroke="#7d8fff" stroke-width="1.5" opacity="0.4" stroke-dasharray="6 4"/>
  <polygon points="395,434 405,434 400,440" fill="#7d8fff" opacity="0.6"/>

  <!-- Legend -->
  <rect x="20" y="450" width="12" height="12" rx="2" fill="#334eff"/>
  <text x="38" y="461" fill="#868a92" font-size="10">Persona</text>
  <rect x="100" y="450" width="12" height="12" rx="2" fill="#212225" stroke="#363a3f" stroke-width="1"/>
  <text x="118" y="461" fill="#868a92" font-size="10">Knowledge file</text>
  <rect x="210" y="450" width="12" height="12" rx="10" fill="none" stroke="#3fd869" stroke-width="1.5" stroke-dasharray="2 2"/>
  <text x="228" y="461" fill="#868a92" font-size="10">Live data source</text>
</svg>
